version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: agrikarma-postgres
    environment:
      POSTGRES_DB: agrikarma
      POSTGRES_USER: agrikarma_user
      POSTGRES_PASSWORD: agrikarma_pass
      TZ: Asia/Kolkata   # ✅ FIX
    ports:
      - "5432:5432"
    volumes:
      - agrikarma_pgdata:/var/lib/postgresql/data

volumes:
  agrikarma_pgdata:
