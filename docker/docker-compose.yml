version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: agrikarma-postgres
    environment:
      POSTGRES_DB: agrikarma
      POSTGRES_USER: agrikarma_user
      POSTGRES_PASSWORD: agrikarma_pass
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - agrikarma_pgdata:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: agrikarma-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: agrikarma-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  agrikarma_pgdata:
